# neoplasticism for tmux
# Generated from palette.toml by build.py. Edit templates/tmux/neoplasticism.conf instead.
# ./install.sh links this to ~/.config/tmux/neoplasticism.conf and sources it at the end
# of tmux.conf. Reload a running server with: tmux source-file ~/.config/tmux/tmux.conf

# Status bar: inverted, white bar with black text. status-bg/fg and the per-part styles
# are reset first: tmux lets them override status-style, and other themes leave them set.
set -g status-bg default
set -g status-fg default
set -g status-left-style default
set -g status-right-style default
set -g window-status-style default
set -g window-status-current-style default
set -g status-style "bg=#ffffff,fg=#141414"
set -g status-left-length 30
set -g status-left " #S "
set -g status-right " #h "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#141414,fg=#ffffff] #I:#W "
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#323232"
set -g pane-active-border-style "fg=#8fd0ff"

# Messages, prompts, copy mode
set -g message-style "bg=#e8df95,fg=#141414"
set -g message-command-style "bg=#e8df95,fg=#141414"
set -g mode-style "bg=#8fd0ff,fg=#141414"
set -g clock-mode-colour "#fdaeba"
