# {{ meta.slug }} for tmux
# Generated from palette.toml by build.py. Edit templates/tmux/neoplasticism.conf instead.
# ./install.sh links this to ~/.config/tmux/neoplasticism.conf and sources it at the end
# of tmux.conf. Reload a running server with: tmux source-file ~/.config/tmux/tmux.conf

# Status bar: inverted, white bar with black text. status-bg/fg are reset first because
# tmux lets them override status-style, and other themes leave them set.
set -g status-bg default
set -g status-fg default
set -g status-style "bg={{ fg }},fg={{ bg }}"
set -g status-left-length 30
set -g status-left " #S "
set -g status-right " #h "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg={{ bg }},fg={{ fg }}] #I:#W "
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg={{ gray2 }}"
set -g pane-active-border-style "fg={{ focus }}"

# Messages, prompts, copy mode
set -g message-style "bg={{ accent }},fg={{ bg }}"
set -g message-command-style "bg={{ accent }},fg={{ bg }}"
set -g mode-style "bg={{ focus }},fg={{ bg }}"
set -g clock-mode-colour "{{ alert }}"
